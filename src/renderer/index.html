<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>ZCamera</title><link rel="stylesheet" href="styles.css" /></head>
  <body>
    <main id="app">
      <nav class="tabs"><button class="tab active" data-page="discover">Discover</button><button class="tab" data-page="live" disabled>Live</button><button class="tab" data-page="gallery" disabled>Gallery</button><button id="debug-toggle" class="secondary">Debug</button></nav>
      <section id="discover" class="page active"><div class="section-heading"><div><p class="eyebrow">LOCAL NETWORK</p><h2>Find a camera.</h2></div><div class="scan-controls"><label for="interface">Network interface</label><select id="interface"><option value="">All interfaces</option></select><button id="scan">Scan 10 seconds</button></div></div><p id="scan-status" class="muted">Ready to scan.</p><div id="camera-list" class="camera-list"><p class="muted">No cameras discovered yet.</p></div></section>
      <section id="live" class="page"><div class="panel-tools"><button id="panel-camera-toggle" class="panel-icon" title="Toggle camera list">▤</button><button id="panel-preview-toggle" class="panel-icon" title="Toggle live screen">▶</button><button id="panel-settings-toggle" class="panel-icon" title="Toggle settings">⚙</button></div><div class="live-shell"><aside class="camera-rail"><button id="rail-close" class="panel-close" title="Close camera list">×</button><p class="eyebrow">CAMERAS</p><div id="live-camera-list"></div></aside><div class="live-main"><div class="live-grid"><div><div class="preview-card"><video id="preview-video" autoplay playsinline muted style="display: none"></video><img id="preview" alt="Camera preview" /><canvas id="af-overlay" class="af-overlay"></canvas><button id="preview-close" class="panel-close" title="Close live screen">×</button><div class="hud-top"><div class="hud-rec-group"><span id="hud-rec" class="hud-rec hidden">● REC</span><span id="hud-rec-dur" class="hud-rec-dur hidden"></span><span id="hud-rec-remain" class="hud-rec-dur hidden"></span><span id="hud-rec-file" class="hud-rec-file hidden"></span></div><span id="hud-mode" class="hud-mode">-</span></div><div class="hud-info"><span>ISO <b id="hud-iso">-</b></span><span><b id="hud-shutter">-</b></span><span>EV <b id="hud-ev">-</b></span><span><b id="hud-wb">-</b></span><span><b id="hud-iris">-</b></span><span>FPS <b id="hud-fps">-</b></span><span><b id="hud-res">-</b></span><span><b id="hud-temp">-</b></span></div><div class="hud-actions"><button id="record" class="hud-button">● REC</button><button id="photo" class="hud-button secondary">◉ Photo</button></div><div id="preview-message" class="preview-message">Preview will appear after connection.</div></div></div></div><div class="live-settings"><button id="settings-close" class="panel-close" title="Close settings">×</button><div class="subtabs" id="settings-tabs"></div><div id="settings-pages"></div></div></div></div></section>
      <section id="gallery" class="page"><div class="section-heading"><div><p class="eyebrow">MEDIA</p><h2>Camera gallery.</h2></div><div class="gallery-actions"><button id="gallery-back" class="secondary hidden">Back</button><button id="gallery-refresh" class="secondary">Refresh</button></div></div><div id="gallery-breadcrumb" class="gallery-breadcrumb muted"></div><div id="gallery-content" class="library-grid"><p class="muted">Connect a camera to browse media.</p></div></section><div id="media-viewer" class="media-viewer hidden" role="dialog" aria-modal="true" aria-label="Media viewer"><button id="media-viewer-close" class="media-viewer-close" title="Close">×</button><div id="media-viewer-content"></div></div>
      <div id="connect-dialog" class="connect-dialog hidden"><div class="connect-dialog-card"><strong id="connect-title">Connect to camera</strong><p id="connect-error" class="connect-error hidden"></p><label>Protocol<select id="connect-scheme"><option value="">Auto</option><option value="http">HTTP</option><option value="https">HTTPS</option></select></label><input id="connect-user" placeholder="Username" autocomplete="off"><input id="connect-pass" type="password" placeholder="Password"><div class="connect-actions"><button id="connect-cancel" class="secondary">Cancel</button><button id="connect-go">Connect</button></div></div></div>
      <aside id="debug-panel" class="debug-panel" hidden><button id="debug-close" class="debug-x" title="Close">×</button><div class="debug-title-row"><strong>Debug</strong></div><div class="debug-actions"><button id="debug-copy" class="secondary">Copy</button><button id="debug-clear" class="secondary">Clear</button></div><pre id="debug-log"></pre></aside>
    </main><script src="renderer.js"></script>
  </body>
</html>
